# Publishes site/ and nothing else.
#
# docs/ holds the planning record and the runbook, and pointing Pages at the
# repository root or at docs/ would put the internal plans on a website. The
# one file from docs/ that the download page links to is linked on github.com,
# where it is already public and already reads as source.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a half-published download
# page is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true turns Pages on if it is off. Without it the first
      # deploy into a repository where nobody has visited Settings fails on
      # "Get Pages site failed... verify that the repository has Pages
      # enabled", which is a manual step hiding inside an automated one.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
