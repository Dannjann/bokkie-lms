# This is the only Windows machine bokkie has. It proves the service registers,
# starts, answers and comes out again — against the exact binary a draft release
# is holding, before anybody can download it.
#
# It does not prove: that bokkie.local resolves on a Windows 10 counter PC — the
# single most likely support call, and no runner will ever show it; that
# SmartScreen lets the download through; or that Windows Defender does not
# quarantine an unsigned, freshly published executable. Those need the real
# machine, and they are the step's gate rather than this file's job.
#
# `make ci` and the pre-push hook remain the gate for whether the code is good.
# Nothing here decides that.
name: verify-windows

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check, for example v0.1.0
        required: true

# contents: write rather than read, and it writes nothing. A draft release is
# visible only to accounts with push access, and `contents: read` is not push
# access — with read, the download below 404s and this check never runs at all.
permissions:
  contents: write

jobs:
  install-and-remove:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Dispatched by hand, the tag is typed, and the two ways of typing it
      # wrong both end in `gh release download` saying "release not found" —
      # which is true and tells nobody what to do about it.
      - name: This tag names a release
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "TAG is '$env:TAG'. A bokkie release is vMAJOR.MINOR.PATCH, with the v — " +
                  "internal/release refuses anything else, so '$env:TAG' could not have been signed."
          }
          if (-not (gh release view $env:TAG --repo "${{ github.repository }}" 2>$null)) {
            throw "There is no release for $env:TAG yet, draft or published. " +
                  "This check runs against the draft that 'make publish' creates on the developer's machine — " +
                  "it builds and signs there, because the signing key never comes here. " +
                  "Sequence: git tag -a $env:TAG -m '...' && make release && make publish."
          }
          Write-Host "$env:TAG exists; checking the assets it holds"

      # The release's own assets, not a fresh build: the point is to exercise
      # the bytes the owner will download, including the copy step that made
      # BokkieSetup.exe out of bokkie-win-amd64.exe.
      - name: Download the release's own assets
        run: gh release download "$env:TAG" --repo "${{ github.repository }}" --pattern "BokkieSetup.exe" --pattern "latest.json*"

      - name: It is the binary the signed manifest describes
        run: |
          $want = (Get-Content latest.json | ConvertFrom-Json).artifacts |
                  Where-Object { $_.platform -eq "windows/amd64" }
          $got = (Get-FileHash BokkieSetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want.sha256) {
            throw "BokkieSetup.exe hashes $got, the manifest says $($want.sha256)"
          }
          Write-Host "BokkieSetup.exe matches the manifest entry for $($want.file)"

      # The one line in the diff that no test and no type-check can judge.
      # GetConsoleProcessList is declared by hand against kernel32; if the proc
      # lookup is wrong it returns 0, and a double-click then shows usage in a
      # window that flashes and vanishes — the exact failure this step exists
      # to close. Every other step here passes arguments, so without this the
      # call is never made on Windows at all.
      - name: The console can be counted
        run: |
          $count = .\BokkieSetup.exe setup --probe-console
          if (-not ($count -match '^\d+$')) { throw "probe-console printed '$count', not a number" }
          if ([int]$count -lt 1) {
            throw "GetConsoleProcessList returned $count with a console attached; a double-click would show usage and vanish"
          }
          Write-Host "console process count: $count"

      - name: Install
        run: .\BokkieSetup.exe install

      - name: It answers
        run: |
          $body = Invoke-RestMethod http://localhost:8080/healthz
          if ($body.status -ne "ok") { throw "healthz said $($body.status)" }
          Write-Host "healthz: $($body | ConvertTo-Json -Compress)"

      # A service that only runs while somebody is logged in is the mistake
      # internal/service's package comment is written about, and it is not
      # discovered until the morning the station reboots.
      - name: It starts with the computer
        run: |
          $qc = sc.exe qc bokkie | Out-String
          if ($qc -notmatch "AUTO_START") { throw "the service is not set to start automatically:`n$qc" }
          Write-Host $qc

      - name: It is in Add/Remove Programs
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Bokkie"
          $entry = Get-ItemProperty $key
          if (-not $entry.UninstallString) { throw "no UninstallString under $key" }
          Write-Host "$($entry.DisplayName) $($entry.DisplayVersion) -> $($entry.UninstallString)"

      # The spec asks for this by name: the runner cannot click a shortcut, so
      # it reads the .lnk back. Without it FindEdge, the known-folder lookup,
      # the PowerShell call and ShortcutScript's real round trip are
      # unexercised anywhere — and the shortcut is what every counter PC runs.
      - name: The desktop shortcut is a real shortcut
        run: |
          "" | .\BokkieSetup.exe setup --elevated --do=shortcut
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Bokkie.lnk'
          if (-not (Test-Path $lnk)) { throw "no shortcut at $lnk" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($s.TargetPath -notmatch 'msedge\.exe$') { throw "shortcut target is $($s.TargetPath)" }
          if ($s.Arguments -ne '--app=http://bokkie.local:8080') { throw "shortcut arguments are $($s.Arguments)" }
          Write-Host "$($s.TargetPath) $($s.Arguments)"

      # The diagnostic is only worth having if it is right about a station that
      # works, so this checks what it says rather than only that it ran.
      #
      # It deliberately does NOT require an all-clear. This runner is a single
      # cloud VM with no mDNS resolver and no second machine, so bokkie.local
      # cannot resolve here and never will — doctor reporting that is doctor
      # being correct. Asserting health here would be asserting something about
      # Azure rather than about bokkie, and the way to prove the name works is
      # a counter PC, which no runner has.
      - name: The self-check reads the station correctly
        run: |
          $out = .\BokkieSetup.exe doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '\[\s*ok\s*\].*running on this computer') {
            throw "doctor did not see the service it has just watched install and answer"
          }
          if ($out -notmatch 'version v') {
            throw "doctor did not report the serving version"
          }
          # Every failure it does report has to carry a next step; a report
          # without one has moved the support call rather than removed it.
          if (($out -match '\[ FAIL \]') -and ($out -notmatch '->')) {
            throw "doctor reported a fault with nothing to do about it"
          }
          # doctor exits non-zero when it finds a problem, which is right, and
          # GitHub's pwsh wrapper ends the step with $LASTEXITCODE. Without
          # this the step grades doctor's verdict about this VM instead of the
          # assertions above — which is the thing the comment at the top of
          # this step exists to avoid.
          exit 0

      # The short address is the whole reason port 80 is bound: people type
      # the name, not the name and a port.
      - name: The short address reaches the app
        run: |
          $r = Invoke-WebRequest http://localhost/healthz -MaximumRedirection 5
          if ($r.StatusCode -ne 200) { throw "port 80 answered $($r.StatusCode)" }
          Write-Host "http://localhost -> $($r.StatusCode)"

      - name: Uninstall
        run: .\BokkieSetup.exe uninstall

      # The data folder surviving an uninstall is a promise the runbook makes to
      # somebody who may have pressed Uninstall by accident.
      - name: The database is still there
        run: |
          if (-not (Test-Path "C:\ProgramData\Bokkie")) { throw "the data folder was removed by uninstall" }
          Get-ChildItem "C:\ProgramData\Bokkie"

      - name: The service is gone
        run: |
          $svc = Get-Service bokkie -ErrorAction SilentlyContinue
          if ($svc) { throw "the bokkie service is still registered after uninstall" }
