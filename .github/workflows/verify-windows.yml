# This is the only Windows machine bokkie has.
#
# Since step 2.7 the station runs while a person has its window open and at no
# other time, so this exercises that: serve, answer, check itself, stop, and
# leave nothing behind that Windows could start on its own.
#
# It does not prove: that a browser launched with its own profile directory
# exits when its window is closed (there is no desktop here — serve runs with
# --no-window); that bokkie.local resolves on a Windows 10 counter PC, which is
# the single most likely support call and which no runner will ever show; that
# SmartScreen lets the download through; or that Defender leaves an unsigned,
# freshly published executable alone. Those need the real machine.
#
# `make ci` and the pre-push hook remain the gate for whether the code is good.
# Nothing here decides that.
name: verify-windows

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check, for example v0.1.0
        required: true

# contents: write rather than read, and it writes nothing. A draft release is
# visible only to accounts with push access, and `contents: read` is not push
# access — with read, the download below 404s and this check never runs at all.
permissions:
  contents: write

jobs:
  serve-and-stop:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Dispatched by hand, the tag is typed, and the two ways of typing it
      # wrong both end in `gh release download` saying "release not found" —
      # which is true and tells nobody what to do about it.
      - name: This tag names a release
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "TAG is '$env:TAG'. A bokkie release is vMAJOR.MINOR.PATCH, with the v — " +
                  "internal/release refuses anything else, so '$env:TAG' could not have been signed."
          }
          if (-not (gh release view $env:TAG --repo "${{ github.repository }}" 2>$null)) {
            throw "There is no release for $env:TAG yet, draft or published. " +
                  "This check runs against the draft that 'make publish' creates on the developer's machine — " +
                  "it builds and signs there, because the signing key never comes here. " +
                  "Sequence: git tag -a $env:TAG -m '...' && make release && make publish."
          }
          Write-Host "$env:TAG exists; checking the assets it holds"

      # The release's own assets, not a fresh build: the point is to exercise
      # the bytes the owner will download. BokkieSetup.exe is the install
      # wizard; the program it installs is bokkie-win-amd64.exe, which is the
      # file the signed manifest describes.
      - name: Download the release's own assets
        run: gh release download "$env:TAG" --repo "${{ github.repository }}" --pattern "BokkieSetup.exe" --pattern "bokkie-win-amd64.exe" --pattern "latest.json*"

      - name: It is the binary the signed manifest describes
        run: |
          $want = (Get-Content latest.json | ConvertFrom-Json).artifacts |
                  Where-Object { $_.platform -eq "windows/amd64" }
          $got = (Get-FileHash bokkie-win-amd64.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want.sha256) {
            throw "bokkie-win-amd64.exe hashes $got, the manifest says $($want.sha256)"
          }
          Write-Host "bokkie-win-amd64.exe matches the manifest entry for $($want.file)"

      # The wizard, run silently with its default choice: a station computer.
      - name: The installer installs the program and nothing that starts it
        run: |
          $p = Start-Process -FilePath .\BokkieSetup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }

          $exe = Join-Path $env:ProgramFiles 'Bokkie\bokkie.exe'
          if (-not (Test-Path $exe)) { throw "bokkie.exe was not installed at $exe" }
          $want = (Get-Content latest.json | ConvertFrom-Json).artifacts | Where-Object { $_.platform -eq "windows/amd64" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $want.sha256) {
            throw "the installed bokkie.exe is not the signed binary"
          }
          if (-not (Test-Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Bokkie.lnk'))) {
            throw "no Start menu entry"
          }
          if (-not (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Bokkie' -ErrorAction SilentlyContinue)) {
            throw "no Add/Remove Programs entry"
          }
          netsh advfirewall firewall show rule name="Bokkie LMS" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "no firewall rule" }
          if (Get-Service bokkie -ErrorAction SilentlyContinue) { throw "the installer registered a service" }
          Write-Host "installed: program, Start menu, Add/Remove Programs, firewall rule; no service"

      - name: The uninstaller removes it and keeps the records
        run: |
          $dir = Join-Path $env:ProgramFiles 'Bokkie'
          # _?= keeps the uninstaller from copying itself away and returning
          # before it has finished.
          $p = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir 'bokkie.exe')) { throw "bokkie.exe is still there" }
          if (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Bokkie' -ErrorAction SilentlyContinue) {
            throw "the Add/Remove Programs entry is still there"
          }
          netsh advfirewall firewall show rule name="Bokkie LMS" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the firewall rule is still there" }
          Write-Host "uninstalled cleanly"
          exit 0

      # The one line in the diff that no test and no type-check can judge.
      # GetConsoleProcessList is declared by hand against kernel32; if the proc
      # lookup is wrong it returns 0, and a double-click then shows usage in a
      # window that flashes and vanishes — the exact failure this closes.
      - name: The console can be counted
        run: |
          $count = .\bokkie-win-amd64.exe setup --probe-console
          if (-not ($count -match '^\d+$')) { throw "probe-console printed '$count', not a number" }
          if ([int]$count -lt 1) {
            throw "GetConsoleProcessList returned $count with a console attached; a double-click would show usage and vanish"
          }
          Write-Host "console process count: $count"

      # Installing is gone. `bokkie install` refuses on Windows since 2.7,
      # because a verb that registers an auto-starting service is the hard
      # requirement undone by anybody who types it.
      - name: Installing is refused
        run: |
          $out = .\bokkie-win-amd64.exe install 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw "bokkie install succeeded on Windows; it must refuse" }
          if ($out -notmatch 'while its window is open') { throw "the refusal does not say what to do instead:`n$out" }
          exit 0

      - name: Start the station
        run: |
          $p = Start-Process -FilePath .\bokkie-win-amd64.exe -ArgumentList 'serve','--no-window' -PassThru
          $p.Id | Out-File station.pid
          Write-Host "station pid $($p.Id)"

      - name: It answers
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            try { $body = Invoke-RestMethod http://localhost:8080/healthz } catch { $body = $null }
          } while (-not $body -and (Get-Date) -lt $deadline)

          if (-not $body) { throw "the station never answered on 8080" }
          if ($body.status -ne "ok") { throw "healthz said $($body.status)" }
          Write-Host "healthz: $($body | ConvertTo-Json -Compress)"

      # The diagnostic is only worth having if it reads a working station
      # correctly. It does NOT have to report an all-clear: this runner has no
      # mDNS resolver, so bokkie.local cannot resolve here and doctor saying so
      # is doctor being right.
      - name: The self-check reads the station correctly
        run: |
          $out = .\bokkie-win-amd64.exe doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '\[\s*ok\s*\].*running on this computer') {
            throw "doctor did not see the station it has just watched answer"
          }
          if ($out -notmatch '\[\s*ok\s*\].*starts Bokkie on its own') {
            throw "doctor did not confirm that nothing starts the station by itself"
          }
          if (($out -match '\[ FAIL \]') -and ($out -notmatch '->')) {
            throw "doctor reported a fault with nothing to do about it"
          }
          exit 0

      - name: Bokkie's log
        if: always()
        run: Get-Content (Join-Path $env:LOCALAPPDATA 'Bokkie\logs\*.log') -ErrorAction SilentlyContinue | Select-Object -Last 40

      # Port 80 being taken is a supported outcome, not a failure: the app logs
      # it and carries on, because refusing to serve a station over a
      # convenience would be the tail wagging the dog.
      - name: The short address reaches the app, or says why not
        run: |
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'Bokkie\logs\*.log') -ErrorAction SilentlyContinue | Out-String
          $bound = $log -match 'also answering on the short address'
          $taken = $log -match 'port 80 is not available'
          Write-Host "bound=$bound taken=$taken"

          if ($taken) {
            Write-Host "Port 80 was already in use on this runner. What holds it:"
            netstat -ano | Select-String ':80\s' | Select-Object -First 5
            exit 0
          }
          if (-not $bound) { throw "the log says neither that port 80 was bound nor that it was unavailable" }

          $r = Invoke-WebRequest http://localhost/healthz -MaximumRedirection 5
          if ($r.StatusCode -ne 200) { throw "port 80 answered $($r.StatusCode)" }
          Write-Host "http://localhost -> $($r.StatusCode)"

      # The Stop button on the station's own screen, through the same endpoint.
      - name: Stopping it from its own screen stops it
        run: |
          Invoke-RestMethod -Method Post http://localhost:8080/api/control/stop | Out-Null

          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 2
            try { Invoke-RestMethod http://localhost:8080/healthz | Out-Null; $up = $true }
            catch { $up = $false }
          } while ($up -and (Get-Date) -lt $deadline)

          if ($up) { throw "the station was still answering 30s after it was told to stop" }
          Write-Host "the station stopped, and the port is free"

      # The promise the runbook makes to somebody who closed the window.
      - name: The database is still there, and so is a backup
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'Bokkie'
          if (-not (Test-Path (Join-Path $data 'bokkie.db'))) { throw "the database is missing after a stop" }
          $backups = Get-ChildItem (Join-Path $data 'backups') -Filter 'bokkie-*.db' -ErrorAction SilentlyContinue
          if (-not $backups) { throw "closing the station left no backup" }
          foreach ($b in $backups) {
            if ($b.Name -like '*.partial') { throw "a half-written backup was left under a real name: $($b.Name)" }
          }
          Write-Host "$($backups.Count) backup(s), none partial"

      # The hard requirement, asserted after a real serve rather than after an
      # install/uninstall cycle. Bokkie is open when a person has opened its
      # window and at no other time, so nothing may be left behind that Windows
      # would start on its own. The five are checked by name because a
      # requirement to not do five things erodes one convenience at a time.
      - name: Nothing is left that could start it without a person
        if: always()
        run: |
          if (Get-Service bokkie -ErrorAction SilentlyContinue) { throw "a service was left installed" }

          foreach ($k in 'Run','RunOnce') {
            $v = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\$k" -Name Bokkie -ErrorAction SilentlyContinue
            if ($v) { throw "a $k registry entry was left behind" }
          }

          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\StartUp\Bokkie.lnk'
          if (Test-Path $lnk) { throw "a Startup folder shortcut was left behind" }

          schtasks /query /tn Bokkie 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "a scheduled task was left behind" }

          Write-Host "nothing can start the station without a person"
          exit 0
